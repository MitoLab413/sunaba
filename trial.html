    //ランドマークから特定のポイントを抜き取る関数
    function getPoints(results, side, names) {
      const map = LANDMARK_INDEX[side]
  
      return names.map(name => results.poseLandmarks[map[name]])
    }


    //pose1とpose2からベクトルを作る関数
    function makeVector(pose1,pose2){//始点,終点
      const vector1 = {
          x:Math.round((pose2.x-pose1.x)*1000000)/1000000,
          y:Math.round((pose2.y-pose1.y)*1000000)/1000000,
          z:Math.round((pose2.z-pose1.z)*1000000)/1000000,
          visibility:Math.min(pose1.visibility,pose2.visibility),
      }
      return vector1;
    }

    //キーポイントを引数とした角度の計算
    function calcAngle(pose1,pose2,pose3){
        // please learn here -> https://npm.runkit.com/%40mediapipe%2Fpose

        const vector1 = {
            x:Math.round((pose1.x-pose2.x)*1000000)/1000000,
            y:Math.round((pose1.y-pose2.y)*1000000)/1000000,
            z:Math.round((pose1.z-pose2.z)*1000000)/1000000,
            visibility:Math.min(pose1.visibility,pose2.visibility),
        }
        const vector2 = {
            x:Math.round((pose3.x-pose2.x)*1000000)/1000000,
            y:Math.round((pose3.y-pose2.y)*1000000)/1000000,
            z:Math.round((pose3.z-pose2.z)*1000000)/1000000,
            visibility:Math.min(pose3.visibility,pose2.visibility),
        }

        //console.log("arrived vector",vector1,vector2)
        return {
            angle: Math.acos((vector1.x * vector2.x + vector1.y * vector2.y + vector1.z * vector2.z) / ( Math.sqrt(vector1.x**2 + vector1.y**2 + vector1.z**2) * Math.sqrt(vector2.x**2 + vector2.y**2 + vector2.z**2))) * 180 / Math.PI,
            visibility: Math.min(vector1.visibility, vector2.visibility),
            "vector1":vector1,
            "vector2":vector2,
        };
    }

    //ベクトルを引数とした角度の計算
    function calcVectorAngle(vector1,vector2){
      return {
          angle: Math.acos((vector1.x * vector2.x + vector1.y * vector2.y + vector1.z * vector2.z) / ( Math.sqrt(vector1.x**2 + vector1.y**2 + vector1.z**2) * Math.sqrt(vector2.x**2 + vector2.y**2 + vector2.z**2))) * 180 / Math.PI,
          visibility: Math.min(vector1.visibility, vector2.visibility),
          "vector1":vector1,
          "vector2":vector2,
      };
    }

    //ランドマークのインデックス
    const LANDMARK_INDEX = {
      left: {
      hip: 23,
      shoulder: 11,
      elbow: 13,
      wrist: 15
      },
      right: {
      hip: 24,
      shoulder: 12,
      elbow: 14,
      wrist: 16
      }
    }

    const JOINT_CONFIG = {
      elbow: {
        min: 30,
        max: 180
      },
      shoulder: {
        min: 20,
        max: 180
      }
    }

    

    //ランドマークから腰、肩、肘の角度を計算する関数
    //右
    function getRShoulderAngle(results, side = 'right') {
      const [hip, shoulder, elbow] = getPoints(results, side, ['hip', 'shoulder', 'elbow'])
      return calcAngle(hip, shoulder, elbow)
    }

    //左
    function getLShoulderAngle(results, side = 'left') {
      const [hip, shoulder, elbow] = getPoints(results, side, ['hip', 'shoulder', 'elbow'])
      return calcAngle(hip, shoulder, elbow)
    }

    //ランドマークから肩、肘、手首の角度を計算する関数
    //右
    function getRElbowAngle(results, side = 'right') {
      const [shoulder, elbow, wrist] = getPoints(results, side, ['shoulder', 'elbow', 'wrist'])
      return calcAngle(shoulder, elbow, wrist)
    }

    //左
    function getLElbowAngle(results, side = 'left') {
      const [shoulder, elbow, wrist] = getPoints(results, side, ['shoulder', 'elbow', 'wrist'])
      return calcAngle(shoulder, elbow, wrist)
    }

    //ランドマークから手首のy座標を抜き取る関数
    //右
    function getRWrist(results, side = 'right') {
      const wrist = getPoints(results, side, ['wrist'])[0]

      return{
        X:wrist.x,
        Y:wrist.y,
        Z:wrist.z,
        visibility: wrist.visibility
      }
    }

    //左
    function getLWrist(results, side = 'left') {
      const wrist = getPoints(results, side, ['wrist'])[0]

      return {
        X:wrist.x,  
        Y:wrist.y,
        Z:wrist.z,
        visibility: wrist.visibility
      }
    }

    // 手首のy座標を周波数にマッピングする関数
    function mapWristToFrequency(wristY) {
      if (!isFinite(wristY)) return 300; // デフォルト値
      const minFreq = 200
      const maxFreq = 500

  // 安全にクランプ
      const y = Math.max(0, Math.min(1, wristY))

  // 上に行くほど高音
      const inverted = 1 - y

      return minFreq + (maxFreq - minFreq) * inverted
    }

    // 角度を周波数にマッピングする関数
    /*function mapAngleToFrequency(angle, targetAngle, minAngle, maxAngle) {

    function mapAngleToFrequency(angle, targetAngle, minAngle, maxAngle) {
      if (!isFinite(angle)) return 523.251 // C5

      const baseFreq = 523.251 // C5
      const maxOffset = 200   // 上下の変化幅
      const DEAD_ZONE = 5

      const clamped = Math.max(minAngle, Math.min(maxAngle, angle))
      const error = clamped - targetAngle // 符号付き

      // デッドゾーン
      if (Math.abs(error) <= DEAD_ZONE) {
        //return baseFreq
        return baseFreq + Math.sin(Date.now() * 0.005) * 3 // デッドゾーン内は微妙に揺らす
      }

      let normalized

      if (error > 0) {
        // 上方向
        const maxError = maxAngle - targetAngle
        normalized = (error - DEAD_ZONE) / (maxError - DEAD_ZONE)
      } else {
        // 下方向
        const maxError = targetAngle - minAngle
        normalized = (-error - DEAD_ZONE) / (maxError - DEAD_ZONE)
      }

      normalized = Math.min(Math.max(normalized, 0), 1)

      // イージング（滑らかに）
      normalized = normalized * normalized

      // 上下で周波数を分ける
      if (error > 0) {
        return baseFreq + maxOffset * normalized  // 上→高音
      } else {
        return baseFreq - maxOffset * normalized  // 下→低音
      }
    }

    // 関節の角度を周波数にマッピングする関数
    function mapJointAngleToFrequency(angle, target, config) {
      return mapAngleToFrequency(
        angle,
        target,
        config.min,
        config.max
      )
    }

    // 手首のx座標とy座標を周波数にマッピングする関数
    function map2DToFrequency(x, y) {
      const baseFreq = mapWristToFrequency(y)

      // xで±変化させる
      const offset = (x - 0.5) * 200  // -100〜+100Hz

      return baseFreq + offset
    }

    const audioContext = new (window.AudioContext || window.webkitAudioContext)()

    // 指定した周波数で音を鳴らす関数
    function playTone(freq) {
      const oscillator = audioContext.createOscillator()
      oscillator.frequency.setValueAtTime(freq, audioContext.currentTime)
      oscillator.type = 'sine'

      const gainNode = audioContext.createGain()
      gainNode.gain.setValueAtTime(1.2, audioContext.currentTime)
      //gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 1.5)
      oscillator.connect(gainNode)
      gainNode.connect(audioContext.destination)
      oscillator.start()
      //oscillator.stop(audioContext.currentTime + 1.5)
      window.oscillator = oscillator;
      window.gainNode = gainNode;
    }

    //周波数を受け取って音を鳴らす関数
    function updateTone(freq) {
      if (window.oscillator) {
        window.oscillator.frequency.setValueAtTime(
        freq,
        audioContext.currentTime
      )
      } else {
        playTone(freq)
      }
    }

    function playRichTone(freq) {
      const osc1 = audioContext.createOscillator()
      const osc2 = audioContext.createOscillator()

      osc1.frequency.setValueAtTime(freq, audioContext.currentTime)
      osc2.frequency.setValueAtTime(freq * 1.5, audioContext.currentTime) // 完全5度

      osc1.type = 'sine'
      osc2.type = 'sine'

      const gain = audioContext.createGain()
      gain.gain.setValueAtTime(0.8, audioContext.currentTime)

      osc1.connect(gain)
      osc2.connect(gain)
      gain.connect(audioContext.destination)

      osc1.start()
      osc2.start()

      window.osc1 = osc1
      window.osc2 = osc2
    }

    function allStop(freq){
      if(window.oscillator){
      window.oscillator.stop();
      window.oscillator = null;
      window.gainNode = null;
    }
}


    

    //毎フレーム描画する関数
    function onResults(results) {
      if (!results.poseLandmarks) {
        //grid.updateLandmarks([]);
        return;
      }

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      /*canvasCtx.drawImage(results.segmentationMask, 0, 0,
                          canvasElement.width, canvasElement.height);*/

      // Only overwrite existing pixels.
      canvasCtx.globalCompositeOperation = 'source-in';
      canvasCtx.fillStyle = '#00FF00';
      canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

      // Only overwrite missing pixels.
      canvasCtx.globalCompositeOperation = 'destination-atop';
      canvasCtx.drawImage(
          results.image, 0, 0, canvasElement.width, canvasElement.height);

      canvasCtx.globalCompositeOperation = 'source-over';
      drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS,
                     {color: '#00FF00', lineWidth: 4});
      drawLandmarks(canvasCtx, results.poseLandmarks,
                   {color: '#FF0000', lineWidth: 2});
      canvasCtx.restore();


      
      const angle1 = getRShoulderAngle(results, 'right')
      const angle2 = getRElbowAngle(results, 'right')
      const RData = getRWrist(results, 'right')

      // visibilityチェック（重要）
      if (angle1.visibility < 0.5 || angle2.visibility < 0.5 || RData.visibility < 0.5) {
        allStop()
        return
      }

  // =====================
  // 音フィードバック
  // =====================
      //const freq = mapWristToFrequency(RData.Y)
      const freq = mapJointAngleToFrequency(
        angle1.angle,
        150,
        JOINT_CONFIG.shoulder
      )
      updateTone(freq)

  // =====================
  // デバッグ
  // =====================
      console.log({
        hipShoulderElbow: angle1.angle,
        shoulderElbowWrist: angle2.angle,
        //elbowY: RData.elbowY,
        wristX: RData.X,
        wristY: RData.Y,
        freq,
      })
      
    }

    
    const pose = new Pose({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});
    pose.setOptions({
      modelComplexity: 0,
      smoothLandmarks: false,
      enableSegmentation: false,
      //smoothSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    window.onload = function() {
        showModal();
    };

    let lastProcessedTime = 0;
    const interval = 50;

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        const now = Date.now();
        if(now - lastProcessedTime > interval){
          lastProcessedTime = now;
        await pose.send({image: videoElement});
        }
      },
      width: 1280,
      height: 720
    });
    camera.start();
</script>
