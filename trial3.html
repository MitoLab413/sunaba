  // =========================================
// キーポイントを引数とした角度計算
// visibilityが低い場合はnullを返す
// =========================================

  function calcAngle(pose1, pose2, pose3){

    // -------------------------------------
    // visibilityチェック
    // どれか1つでも0.5未満なら失敗
    // -------------------------------------

      if(
          pose1.visibility < 0.5 ||
          pose2.visibility < 0.5 ||
          pose3.visibility < 0.5
      ){

        return null;
      }

    // -------------------------------------
    // ベクトル1
    // pose2 -> pose1
    // -------------------------------------

      const vector1 = {

          x: Math.round((pose1.x - pose2.x) * 1000000) / 1000000,
          y: Math.round((pose1.y - pose2.y) * 1000000) / 1000000,
          z: Math.round((pose1.z - pose2.z) * 1000000) / 1000000,

          visibility: Math.min(
            pose1.visibility,
            pose2.visibility
          )
      };

    // -------------------------------------
    // ベクトル2
    // pose2 -> pose3
    // -------------------------------------

      const vector2 = {

          x: Math.round((pose3.x - pose2.x) * 1000000) / 1000000,
          y: Math.round((pose3.y - pose2.y) * 1000000) / 1000000,
          z: Math.round((pose3.z - pose2.z) * 1000000) / 1000000,

          visibility: Math.min(
            pose3.visibility,
            pose2.visibility
          )
      };

    // -------------------------------------
    // 内積
    // -------------------------------------

      const dot =
          vector1.x * vector2.x +
          vector1.y * vector2.y +
          vector1.z * vector2.z;

    // -------------------------------------
    // ベクトル長さ
    // -------------------------------------

      const mag1 = Math.sqrt(
        vector1.x**2 +
        vector1.y**2 +
        vector1.z**2
      );

      const mag2 = Math.sqrt(
        vector2.x**2 +
        vector2.y**2 +
        vector2.z**2
      );

    // -------------------------------------
    // ゼロ除算防止
    // -------------------------------------

      if(mag1 === 0 || mag2 === 0){

        return null;
      }

    // -------------------------------------
    // cosθ
    // -------------------------------------

      let cosTheta = dot / (mag1 * mag2);

    // 浮動小数点誤差対策
      //cosTheta = Math.max(-1, Math.min(1, cosTheta));

    // -------------------------------------
    // 角度計算
    // -------------------------------------

      return {

        angle:
            Math.acos(cosTheta)* 180 / Math.PI,

        visibility: Math.min(
            vector1.visibility,
            vector2.visibility
        ),

        vector1: vector1,
        vector2: vector2

      };
  }

  // =========================================
  // 角度を周波数にマッピングする関数
  // デッドゾーンを設け、目標角度からの誤差が小さい場合は基本周波数を返す
  function mapAngleToFrequency(angle, targetAngle, minAngle, maxAngle) {
      if (!isFinite(angle)) return 523.251 // C5

      const baseFreq = 523.251 // C5
      const maxOffset = 200   // 上下の変化幅
      const DEAD_ZONE = 5

      const clamped = Math.max(minAngle, Math.min(maxAngle, angle))
      const error = clamped - targetAngle // 符号付き

      // デッドゾーン
      if (Math.abs(error) <= DEAD_ZONE) {
        //return baseFreq
        return baseFreq + Math.sin(Date.now() * 0.005) * 3 // デッドゾーン内は微妙に揺らす
      }

      let normalized

      if (error > 0) {
        // 上方向
        const maxError = maxAngle - targetAngle
        normalized = (error - DEAD_ZONE) / (maxError - DEAD_ZONE)
      } else {
        // 下方向
        const maxError = targetAngle - minAngle
        normalized = (-error - DEAD_ZONE) / (maxError - DEAD_ZONE)
      }

      normalized = Math.min(Math.max(normalized, 0), 1)

      // イージング（滑らかに）
      normalized = normalized * normalized

      // 上下で周波数を分ける
      if (error > 0) {
        return baseFreq + maxOffset * normalized  // 上→高音
      } else {
        return baseFreq - maxOffset * normalized  // 下→低音
      }
  }

  // 関節の角度を周波数にマッピングする関数
  function mapJointAngleToFrequency(angle, target, config) {
    return mapAngleToFrequency(
      angle,
      target,
      config.min,
      config.max
    )
  }

  // AudioContextの初期化
  const audioContext = new (window.AudioContext || window.webkitAudioContext)()

  // 指定した周波数で音を鳴らす関数
  function playTone(frequency, startTime, duration, volume = 0.12) {
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(
      frequency,
      startTime
    );

    // 音の立ち上がり・終了を滑らかにする
    gain.gain.setValueAtTime(0.001, startTime);
    gain.gain.linearRampToValueAtTime(
      volume,
      startTime + 0.02
    );
    gain.gain.setValueAtTime(
      volume,
      startTime + duration - 0.03
    );
    gain.gain.linearRampToValueAtTime(
      0.001,
      startTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(startTime);
    oscillator.stop(startTime + duration + 0.01);
  }

  // 腕が目標より低い：低い音 → 高い音
  function playRaiseCue() {
    const now = audioContext.currentTime;

    playTone(220, now, 0.18);
    playTone(440, now + 0.22, 0.18);
  }

  // 腕が目標より高い：高い音 → 低い音
  function playLowerCue() {
    const now = audioContext.currentTime;

    playTone(440, now, 0.18);
    playTone(220, now + 0.22, 0.18);
  }

  // 目標姿勢：連続した安定音
  let targetOscillator = null;
  let targetGain = null;

  function startTargetSound() {
    if (targetOscillator) return;

    targetOscillator = audioContext.createOscillator();
    targetGain = audioContext.createGain();

    targetOscillator.type = "sine";
    targetOscillator.frequency.value = 440;
    targetGain.gain.value = 0.001;

    targetOscillator.connect(targetGain);
    targetGain.connect(audioContext.destination);

    const now = audioContext.currentTime;
    targetGain.gain.setTargetAtTime(0.12, now, 0.04);
    targetOscillator.start(now);
  }

  function stopTargetSound() {
    if (!targetOscillator) return;

    const oscillator = targetOscillator;
    const gain = targetGain;

    gain.gain.setTargetAtTime(
      0.001,
      audioContext.currentTime,
      0.04
    );

    oscillator.stop(audioContext.currentTime + 0.2);

    targetOscillator = null;
    targetGain = null;
  }

  //周波数を受け取って音を鳴らす関数
  function updateTone(freq) {
    if (window.oscillator) {
      window.oscillator.frequency.setValueAtTime(
      freq,
      audioContext.currentTime
    )
    } else {
      playTone(freq)
    }
  }
  // 関節の角度を周波数にマッピングして音を鳴らす関数
  function playRichTone(freq) {
    const osc1 = audioContext.createOscillator()
    const osc2 = audioContext.createOscillator()

    osc1.frequency.setValueAtTime(freq, audioContext.currentTime)
    osc2.frequency.setValueAtTime(freq * 1.5, audioContext.currentTime) // 完全5度

    osc1.type = 'sine'
    osc2.type = 'sine'

    const gain = audioContext.createGain()
    gain.gain.setValueAtTime(0.8, audioContext.currentTime)

    osc1.connect(gain)
    osc2.connect(gain)
    gain.connect(audioContext.destination)

    osc1.start()
    osc2.start()

    window.osc1 = osc1
    window.osc2 = osc2
  }
  // 音を止める関数
  function allStop(freq){
    if(window.oscillator){
      window.oscillator.stop();
      window.oscillator = null;
      window.gainNode = null;
    }
  }

  function analyzeSingleImage(img, selectedJoint){

    return new Promise(async(resolve) => {

    // =====================================
    // Pose解析結果
    // =====================================

      pose.onResults((results) => {

        // 骨格未検出
        if(!results.poseLandmarks){
          resolve(null);
          return;
        }

        const side = "right";

        let angleResult;

      // =====================================
      // 肩関節
      // =====================================

        if(selectedJoint === "shoulder"){
          const [elbow, shoulder, hip] =
            getPoints(
              results,
              side,
              ["elbow", "shoulder", "hip"]
            );

          angleResult =
            calcAngle(
              elbow,
              shoulder,
              hip
            );
        }

      // =====================================
      // 肘関節
      // =====================================

        else if(selectedJoint === "elbow"){
          const [shoulder, elbow, wrist] =
            getPoints(
              results,
              side,
              ["shoulder", "elbow", "wrist"]
            );

          angleResult =
            calcAngle(
              shoulder,
              elbow,
              wrist
           );
        }

      // visibility失敗
        if(angleResult === null){
          resolve(null);
          return;
        }

        // 角度返却
        resolve(angleResult.angle);

      });

    // =====================================
    // 画像送信
    // =====================================

      await pose.send({
        image: img
      });

    });
  }

  function onResults(results){

    if(!results.poseLandmarks){

    // --------------------------

    canvasCtx.save();

    canvasCtx.clearRect(
      0,
      0,
      canvasElement.width,
      canvasElement.height
    );

    canvasCtx.drawImage(
      results.image,
      0,
      0,
      canvasElement.width,
      canvasElement.height
    );

    drawConnectors(
      canvasCtx,
      results.poseLandmarks,
      POSE_CONNECTIONS,
      {
        color:'#00FF00',
        lineWidth:4
      }
    );

    drawLandmarks(
      canvasCtx,
      results.poseLandmarks,
      {
        color:'#FF0000',
        lineWidth:2
      }
    );

    if(step == 1){
      poseNumberDiv.innerHTML =

      jointNameDiv.innerHTML =
        `選択関節: ${selectedJoints[2]}`;
      teacherAngleDiv.innerHTML =
        `目標角度: ${teacherAngles[2].toFixed(1)}°`;
    }
    // --------------------------
    // 現在角度計算
    // --------------------------

    const side = "right";

    let currentAngle;

    // 肩
    if(selectedJoints[0] === "shoulder"){

      const [elbow, shoulder, hip] =
        getPoints(
          results,
          side,
          ["elbow", "shoulder", "hip"]
        );

      currentAngle =
        calcAngle(
          elbow,
          shoulder,
          hip
        );

      if(currentAngle === null){
        currentAngleDiv.innerHTML =
        "現在角度: 検出失敗";
        return;
      }

      currentAngle = currentAngle.angle;
    }

    // 肘
    else if(selectedJoints[0] === "elbow"){

      const [shoulder, elbow, wrist] =
        getPoints(
          results,
          side,
          ["shoulder", "elbow", "wrist"]
        );

      currentAngle =
        calcAngle(
          shoulder,
          elbow,
          wrist
        );

      if(currentAngle === null){
        currentAngleDiv.innerHTML =
          "現在角度: 検出失敗";
        return;
      }

      currentAngle = currentAngle.angle;
    }

  // --------------------------
    // 目標角度との比較
    const targetAngle = teacherAngles[step - 1];

    const diff = Math.abs(currentAngle - targetAngle);

    if(diff <= ANGLE_THRESHOLD){
      if(holdStartTime === null){
      holdStartTime = Date.now();
      }

      const holdTime = Date.now() - holdStartTime;// ホールド時間

      if(holdTime >= HOLD_TIME){
        step = step + 0.5;// 次の姿勢へ（0.5刻みで管理）
        holdStartTime = null;
        OK.play();
        OK.onended = () => {
          OK.currentTime = 0;
          step = step + 0.5;
        }

      if(step > 3){
      alert("全姿勢完了！");
      allStop();
      }
    }

  }else{
    holdStartTime = null;
  }

  // =====================
  // 音フィードバック
  // =====================
    //const freq = mapWristToFrequency(RData.Y)
  let cueTimer = null; 
  if(step == 3 || step == 2 || step == 1){
    if(diff > ANGLE_THRESHOLD){
      stopTargetSound();
      // まだタイマーが動いていない場合だけ開始
      if (cueTimer === null) {
      // 範囲外になったらすぐに1回鳴らす
        if (currentAngle > targetAngle) {
          playLowerCue();
        } else {
          playRaiseCue();
        }
        // 以降は1秒間隔で繰り返す
        cueTimer = setInterval(() => {
        if (currentAngle > targetAngle) {
          playLowerCue();
        }else if(currentAngle < targetAngle) {
          playRaiseCue();
        }
      }, 1000);
    }
  
    }else{
      // 許容範囲に入ったら方向音を停止
      if (cueTimer !== null) {
        clearInterval(cueTimer);
        cueTimer = null;
     }
      startTargetSound();
    }
  }



    // --------------------------
    // 表示
    // --------------------------

    currentAngleDiv.innerHTML =
      `現在角度: ${currentAngle.toFixed(1)}°`;

    //let diff = 0;
    /*if(step == 1){
      diff = Math.abs(currentAngle - teacherAngles[0]);
    }
    if(step == 2){
      diff = Math.abs(currentAngle - teacherAngles[1]);
    }
    if(step == 3){
      diff = Math.abs(currentAngle - teacherAngles[2]);
    }*/

    differenceDiv.innerHTML =
      `角度差: ${diff.toFixed(1)}°`;
    
    var [shoulder, elbow, wrist] = getPoints(
      results,
      side,
      ["shoulder", "elbow", "wrist"]
    );
    console.log(
      `肩: ${shoulder.z.toFixed(2)}, 肘: ${elbow.z.toFixed(2)}, 手首: ${wrist.z.toFixed(2)}, step: ${step}`
    );
  }

</script>
